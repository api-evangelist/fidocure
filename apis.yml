aid: fidocure
name: Fidocure
description: >-
  FidoCure is a translational precision-medicine service for canine cancer, developed by
  One Health Company and backed by a16z. It combines next-generation genomic sequencing of a
  dog's tumor at a CLIA-certified (human-grade) lab with tumor profiling and an AI-driven data
  platform to identify cancer-driving mutations, then recommends personalized targeted
  therapeutics that veterinarians can prescribe. FidoCure has guided treatment for thousands of
  dogs across roughly 1,350 clinics and maintains the largest proprietary canine cancer dataset,
  underpinning peer-reviewed research with Stanford, the Broad Institute, Tufts, and the
  University of Georgia. FidoCure operates as a veterinarian-facing clinical service rather than a
  public developer API; this profile captures its public identity, portal, and domain-security
  posture for the API Evangelist network.
